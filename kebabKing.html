<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kebab King</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        :root {
            --kk-red: #b91c1c;
            --kk-gold: #fbbf24;
            --kk-charcoal: #1f2937;
            --kk-cream: #fff4e6;
            --kk-sauce: #f97316;
        }

        body {
            font-family: "Barlow", system-ui, sans-serif;
            color: var(--kk-charcoal);
            background:
                radial-gradient(circle at top left, rgba(251, 191, 36, 0.25),
                    transparent 55%),
                radial-gradient(circle at 20% 40%, rgba(249, 115, 22, 0.2),
                    transparent 60%),
                linear-gradient(180deg, #fff7ed 0%, #fff 60%, #f8fafc 100%);
            min-height: 100vh;
        }

        h1,
        .brand {
            font-family: "Alfa Slab One", "Barlow", system-ui, sans-serif;
            letter-spacing: 0.04em;
        }

        .brand-badge {
            letter-spacing: 0.2em;
            padding: 0.55rem 1.2rem;
            border-radius: 999px;
            background: var(--kk-red);
            color: #fff;
            text-transform: uppercase;
        }

        .hero-wrap {
            background: linear-gradient(120deg, rgba(185, 28, 28, 0.12),
                    rgba(251, 191, 36, 0.12));
            border: 1px solid rgba(185, 28, 28, 0.2);
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        }

        .menu-card {
            border: 1px solid rgba(185, 28, 28, 0.2);
            border-radius: 1.25rem;
        }

        .menu-card .card-body {
            background: #fff;
        }

        .btn-kebab {
            border-radius: 999px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .btn-kebab--pollo {
            background: #dc2626;
            border-color: #dc2626;
            color: #fff;
        }

        .btn-kebab--cordero {
            background: #f59e0b;
            border-color: #f59e0b;
            color: #1f2937;
        }

        .btn-kebab--ternera {
            background: #16a34a;
            border-color: #16a34a;
            color: #fff;
        }

        .btn-kebab--refresco {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        .btn-kebab--patatas {
            background: #6b7280;
            border-color: #6b7280;
            color: #fff;

        }

        .list-group-item {
            border: none;
            border-bottom: 1px dashed rgba(148, 163, 184, 0.6);
        }

        .list-group-item:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>
    <header class="py-4">
        <div class="container hero-wrap text-center py-4 px-3 px-md-4">
            <span class="brand-badge mb-2 d-inline-block">Kebab King</span>
            <h1 class="display-6 fw-bold mb-2">Tu pedido de kebab al
                instante</h1>
            <p class="text-muted mb-0">Solo pollo, cordero y ternera. Acompana
                con refrescos o patatas fritas.</p>
        </div>
    </header>
    <main class="container pb-5">
        <div class="row g-4">
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm menu-card">
                    <div class="card-body">
                        <h2 class="h5 fw-semibold mb-3">Elige tu producto</h2>
                        <div class="d-grid gap-2 d-md-flex flex-wrap">

                            <button class="btn btn-kebab btn-kebab--pollo" onclick="cestaCompra('Kebab de Pollo')">Kebab de pollo</button>
                            <button class="btn btn-kebab btn-kebab--cordero" onclick="cestaCompra('Kebab de Cordero')">Kebab de cordero</button>
                            <button class="btn btn-kebab btn-kebab--ternera" onclick="cestaCompra('Kebab de Ternera')">Kebab de ternera</button>
                            <button class="btn btn-kebab btn-kebab--refresco" onclick="cestaCompra('Refresco')">Refresco</button>
                            <button class="btn btn-kebab btn-kebab--patatas" onclick="cestaCompra('Patatas')">Patatas fritas</button>

                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm menu-card">
                    <div class="card-body">
                        <h2 class="h5 fw-semibold mb-3">Tu lista</h2>
                        <ul id="lista" class="list-group">
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        function cestaCompra(producto) {
            //si quisiera ocultar un elemto lo cojo por su id y .style.display = "none"
            //si quisiera hacerlo aparecer de nuevo lo mismo con = "block"
            // document.getElementById("pollo").style.display = "none";

            let h = document.createElement("li"); // Creas el tipo.
            h.textContent = producto; // El contenido de li es productos
            document.getElementById("lista").appendChild(h)  

            let b = document.createElement("button")
            b.textContent = "Eliminar"
            h.append(b)
            b.addEventListener("click", () => { h.remove() })
        }

    </script>
</body>

</html>
