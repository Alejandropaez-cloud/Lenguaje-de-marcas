<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LM - Listas</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Times New Roman', Times, serif; /* Fuente con serifa como en la imagen */
            padding: 40px;
            background-color: #f4f4f4; /* Fondo ligeramente grisáceo del navegador */
        }

        /* Contenedor principal para simular la hoja blanca */
        .page {
            background-color: white;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            min-height: 400px;
        }

        /* Título principal */
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        /* Línea horizontal */
        hr {
            border: 0;
            border-top: 1px solid #ccc;
            margin-bottom: 30px;
        }

        /* Título de la sección */
        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        /* Configuración de la lista ordenada */
        ol {
            list-style-type: upper-roman; /* Esto pone los números romanos: I, II, III... */
            font-size: 20px;
            margin-left: 40px;
            line-height: 1.6; /* Separación entre líneas */
        }

        li {
            padding-left: 10px;
        }
    </style>
</head>
<body>

    <div class="page">
        <h1>Listas ordenadas</h1>
        <hr>

        <h2>Asignaturas de ciclo</h2>

        <ol>
            <li>Sistemas operativos monopuesto</li>
            <li>Seguridad informática</li>
            <li>Redes locales</li>
            <li>Ofimática</li>
            <li>Fundamentos</li>
        </ol>
    </div>

</body>
</html>
