<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LM - Prueba</title>
    <style>
        /* Estilos generales del cuerpo */
        body {
            background-color: #338a7a; /* Color verde azulado del fondo */
            color: black;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Estilo para el título principal */
        h1 {
            color: #2a52be; /* Color azul del texto */
            font-size: 32px;
            margin-bottom: 5px;
        }

        /* Línea horizontal blanca */
        hr {
            border: 0;
            border-top: 1px solid white;
            margin-bottom: 40px;
        }

        /* Subtítulo central */
        h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
        }

        /* Estructura de la tabla */
        table {
            margin: 0 auto; /* Centrar la tabla */
            border-collapse: collapse; /* Para que los bordes se vean simples */
            border: 2px solid #2e5d54;
            background-color: transparent;
        }

        td {
            border: 1px solid #2e5d54;
            padding: 10px 20px;
            min-width: 80px;
            height: 30px;
            font-weight: bold;
        }

        /* Fila superior con fondo azul */
        .header-row td {
            background-color: #2a52be;
            color: black;
        }

        /* Ajuste para que la última celda de la primera fila sea larga */
        .blue-fill {
            background-color: #3b5998;
        }
    </style>
</head>
<body>

    <h1>Nombre Alumno:</h1>
    <hr>

    <h2>números de registros</h2>

    <table>
        <tr class="header-row">
            <td>1524</td>
            <td>4785</td>
            <td colspan="2">7415</td>
        </tr>
        <tr>
            <td>3256</td>
            <td rowspan="2">1452</td>
            <td>1458</td>
            <td>2563</td>
        </tr>
        <tr>
            <td>7485</td>
            <td>7412</td>
            <td></td> </tr>
        <tr>
            <td>3695</td>
            <td colspan="2"></td> <td>7485</td>
        </tr>
    </table>

</body>
</html>
